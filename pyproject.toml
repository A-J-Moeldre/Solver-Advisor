[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solver-advisor"
version = "0.2.0"
description = "AI-powered matrix diagnostics and solver recommendations for scientific computing."
readme = "README.md"
authors = [
    { name = "Allar-Joel Möldre" }
]
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "ssgetpy",
]

# Optional: include GUI dependencies only if needed
# "tk" is usually bundled with Python, so we do NOT list it here.

[project.urls]
Homepage = "https://github.com/<your-username>/solver-advisor"
Repository = "https://github.com/<your-username>/solver-advisor"

[project.scripts]
solver-advisor = "cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "tools*"]
