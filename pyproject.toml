[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

name = "solver-advisor"
version = "0.2.0"
description = "AI-powered matrix diagnostics and solver recommendations for scientific computing."
readme = "README.md"
authors = [
    { name = "Allar-Joel Möldre" }
]
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "ssgetpy",
]

[project.urls]
Homepage = "https://github.com/A-J-Moeldre/solver-advisor"
Repository = "https://github.com/A-J-Moeldre/solver-advisor"

[project.scripts]
solver-advisor = "cli.main:main"

[tool.setuptools]
include-package-data = true
packages = ["solver_advisor"]